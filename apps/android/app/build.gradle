plugins {
    id "com.android.application"
}

// The app is a Trusted Web Activity: it opens https://platofy.app full screen in the user's browser engine.
// versionCode comes from CI (the run number) so every Play upload is newer than the last.
def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "app.platofy"
    compileSdk 36

    defaultConfig {
        applicationId "app.platofy"
        minSdk 23
        targetSdk 36
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
        versionName System.getenv("VERSION_NAME") ?: "1.0.0"
    }

    signingConfigs {
        if (keystorePath) {
            upload {
                storeFile file(keystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias "upload"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
